<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hangman | CSE 4095</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="shell"><header><div class="eyebrow">CSE 4095 · WORD GAME</div><h1>HANGMAN<span>.</span></h1><p>Find the word before the drawing is complete.</p></header>
<section class="panel"><div class="toolbar"><label for="difficulty">Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label><button id="new-game" class="primary">New game ↻</button></div>
<div class="game"><div class="drawing"><svg viewBox="0 0 240 240" role="img" aria-label="Hangman drawing"><g stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none"><path d="M28 220 H158 M70 220 V22 H162 V52" class="gallows"/><circle class="part" cx="162" cy="77" r="25"/><path class="part" d="M162 102 V159"/><path class="part" d="M162 118 L126 145"/><path class="part" d="M162 118 L198 145"/><path class="part" d="M162 159 L132 204"/><path class="part" d="M162 159 L192 204"/></g></svg></div><div class="game-info"><div class="tiny">THE SECRET WORD</div><div id="pattern" class="pattern" aria-live="polite">—</div><p id="status" class="status" role="status">Choose a difficulty and start playing.</p><div class="stats"><div><strong id="remaining">6</strong><small>misses left</small></div><div><strong id="incorrect">—</strong><small>wrong letters</small></div></div></div></div>
